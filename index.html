<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa para o TCC</title>

    <style>
        body{
            background-color: aliceblue;
        }

        .painel{
            margin: auto;
            background-color: white;
            width: 380px;
            height: 530px;
            border-radius: 20px;
            text-align: center;
            padding-top: 10px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }
        #sim{
            height: 40px;
            width: 60px;
            background-color: red;
            border: 2px solid white;
            border-radius: 10px;
            color: white;
            margin-left: -50px;
        }
        #nao{
            position: absolute;
            height: 40px;
            width: 60px;
            background-color: red;
            border: 2px solid white;
            border-radius: 10px;
            color: white;
            margin-left: 10px;
        }

    </style>

</head>
<body>

    <div class="painel">
        <h2>Oii Fabi... adoraria te conhecer!</h2>

       <img src="https://raw.githubusercontent.com/danilosoarex/con/main/ducks.jpg"  height="400" width="300">
        <!-- por que uma imagem de patos??? 🤔 -->

        <h2>Aceita sair comigo?</h2>

        <h4>Não é necessariamente um date</h4>
     
        <a><button id="sim" onclick="sim()">SIM</button></a>
        <button onclick="chama()" id="nao">NÃO</button>
        
    </div>

    <script>

        function sim() {
            alert("Você aceitou sair comigo! :)\nPode escolher qualquer local, data e hora ;)\nEu sugiro um passeio no parque pq quero te explicar a foto dos patos no lago dos patos haha!");
            location.href = "https://music.youtube.com/watch?v=zp7NtW_hKJI";
        }

        function chama(){
            setTimeout(function() { fuja(); }, 250);
        }

        function fuja(){
          
            var botaoNao = document.getElementById("nao")

            var larguraJanela = window.innerWidth;
            var alturaJanela = window.innerHeight;

            var maxX = larguraJanela - botaoNao.offsetWidth;
            var maxY = alturaJanela - botaoNao.offsetHeight;

            var aleatorioX = Math.floor(Math.random() * maxX);
            var aleatorioY = Math.floor(Math.random() * maxY);

            botaoNao.style.left = aleatorioX + "px";
            botaoNao.style.top = aleatorioY + "px";

            chama();
        }
    </script>

    
</body>
</html>
