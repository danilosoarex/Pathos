<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="./clock.ico" type="image/x-icon">
  <title>Contagem regressiva</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f8fafc;
      --muted: #b8c1d9;
      --card: rgba(15, 23, 42, .72);
      --accent: #8b5cf6;
      --accent-2: #22d3ee;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 24px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #070b18;
      color: var(--ink);
    }

    body::before, body::after {
      content: "";
      position: fixed;
      width: 340px;
      aspect-ratio: 1;
      border-radius: 50%;
      filter: blur(50px);
      opacity: .35;
      z-index: -1;
    }

    body::before { background: var(--accent); top: -120px; left: -160px; }
    body::after { background: var(--accent-2); bottom: -160px; right: -150px; }

    main {
      width: min(100%, 440px);
      padding: clamp(28px, 7vw, 42px);
      text-align: center;
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 28px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .3);
      backdrop-filter: blur(18px);
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--accent-2);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    h1 { margin: 0; font-size: clamp(1.65rem, 7vw, 2.25rem); line-height: 1.1; }
    .description { margin: 14px auto 28px; color: var(--muted); font-size: .98rem; line-height: 1.5; }

    .timer {
      padding: 22px 12px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(139, 92, 246, .2), rgba(34, 211, 238, .13));
      border: 1px solid rgba(255, 255, 255, .12);
    }

    #hours {
      display: block;
      font-size: clamp(4.3rem, 22vw, 6.5rem);
      font-weight: 800;
      line-height: .9;
      letter-spacing: -.07em;
      font-variant-numeric: tabular-nums;
    }

    .timer span:last-child { display: block; margin-top: 12px; color: var(--muted); font-size: .9rem; }

    img {
      display: block;
      width: min(100%, 260px);
      margin: 28px auto 0;
      border-radius: 18px;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Contagem regressiva...</p>
    <h1>Próximo date:</h1>
    <p class="description" id="target-text">Calculando o tempo restante...</p>

    <div class="timer" aria-live="polite">
      <span id="hours">0</span>
      <span id="label">horas restantes</span>
    </div>

  </main>

  <script>
    // Altere esta variável para a data e hora desejadas (formato: AAAA-MM-DDTHH:MM:SS).
    const dataAlvo = new Date('2026-08-16T10:00:00');

    const hours = document.querySelector('#hours');
    const label = document.querySelector('#label');
    const targetText = document.querySelector('#target-text');

    targetText.textContent = `No dia ${dataAlvo.toLocaleString('pt-BR', { dateStyle: 'long', timeStyle: 'short' })}.`;

    function atualizarTimer() {
      const diferenca = dataAlvo.getTime() - Date.now();
      const horasRestantes = Math.max(0, Math.ceil(diferenca / (1000 * 60 * 60)));

      hours.textContent = horasRestantes.toLocaleString('pt-BR');
      label.textContent = horasRestantes === 1 ? 'hora restante' : 'horas restantes';

      if (diferenca <= 0) {
        targetText.textContent = 'A data definida já chegou!';
        label.textContent = 'horas restantes';
      }
    }

    atualizarTimer();
    setInterval(atualizarTimer, 1000);
  </script>
</body>
</html>
